<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7fc">
  <meta name="description" content="Host a live quiz, join by room code, or practice on your own.">
  <meta name="quizpop-room-api" content="https://quizpop-rooms.buddingbeaver1.chatgpt.site">
  <title>QuizPop | Play &amp; create quizzes</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f8f7fc;
      --ink: #23183c;
      --muted: #635a74;
      --purple: #5c32cc;
      --purple-dark: #4924b2;
      --lavender: #e8e0ff;
      --lemon: #fff0a6;
      --lime: #d5f6ac;
      --pink: #f9daed;
      --line: #e2ddec;
      --radius: 20px;
      font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button, a, input, textarea, summary { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid #5330c0; outline-offset: 4px; }
    h1:focus, h2:focus, main:focus { outline: none; }
    h1, h2, h3, p { margin: 0; }
    [hidden] { display: none !important; }

    .page-width { width: min(1120px, calc(100% - 64px)); margin-inline: auto; }
    .topbar { background: #fff; border-bottom: 1px solid var(--line); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; min-height: 76px; gap: 16px; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 26px;
      font-weight: 850;
      letter-spacing: -.065em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 11px;
      background: var(--purple);
      color: white;
      transform: rotate(-8deg);
      font-size: 25px;
      line-height: 1;
      letter-spacing: 0;
    }
    .topbar nav { display: flex; align-items: center; gap: 12px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 10px 17px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: var(--ink);
      font-weight: 720;
      text-decoration: none;
    }
    .button:hover:not(:disabled) { background: #f0ebff; }
    .button:disabled { opacity: .48; }
    .button.outline { border-color: #d9cfed; color: var(--purple-dark); background: white; }
    .button.outline:hover:not(:disabled) { background: #f4efff; }
    .button.primary { color: white; background: var(--purple); }
    .button.primary:hover:not(:disabled) { background: var(--purple-dark); }
    .button.danger { color: #a02646; }
    .button.danger:hover:not(:disabled) { background: #fff0f3; }
    .icon-plus { font-size: 20px; line-height: 1; }
    #app { padding-block: 37px 50px; }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 54% 46%;
      align-items: center;
      min-height: 373px;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid #e0d5fb;
      border-radius: 28px;
      background: radial-gradient(ellipse at 80% 45%, #f2ebff 0%, var(--lavender) 69%);
    }
    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 395px;
      aspect-ratio: 1;
      right: 39px;
      top: 50%;
      translate: 0 -50%;
      border: 1px solid #d6c5fb;
      border-radius: 50%;
      box-shadow: 0 0 0 34px #e0d3fb70, 0 0 0 68px #e0d3fb40;
    }
    .hero-copy { position: relative; z-index: 1; padding: 42px 0 46px 52px; }
    .hero h1 {
      margin-block: 14px 12px;
      font-size: clamp(3.2rem, 6.5vw, 5.6rem);
      line-height: .98;
      font-weight: 850;
      letter-spacing: -.075em;
    }
    .hero p { max-width: 34ch; color: #524467; font-size: 1.075rem; line-height: 1.5; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 24px; }
    .hero-actions .button { min-height: 50px; padding-inline: 19px; box-shadow: 0 4px 0 #402197; }
    .hero-actions .button:active { translate: 0 2px; box-shadow: 0 2px 0 #402197; }
    .hero-actions .outline { box-shadow: 0 4px 0 #d5c6f6; }
    .hero-actions .outline:active { box-shadow: 0 2px 0 #d5c6f6; }
    .hero-art {
      position: absolute;
      inset: 0 1% 0 auto;
      width: 51%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .library { margin-top: 38px; }
    .library-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 17px; }
    .library h2, .screen-title {
      font-weight: 820;
      font-size: clamp(1.8rem, 4vw, 2.55rem);
      line-height: 1.1;
      letter-spacing: -.052em;
      overflow-wrap: anywhere;
    }
    .timer-option { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: .92rem; font-weight: 650; cursor: pointer; }
    .timer-option input { margin: 0; width: 17px; height: 17px; accent-color: var(--purple); }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
    .quiz-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 3px 0 #e9e4f1;
    }
    .quiz-card:hover { border-color: #c7b7ef; }
    .card-play { display: flex; flex-direction: column; flex: 1; text-align: left; border: 0; padding: 0; background: transparent; color: inherit; }
    .card-play:focus-visible { outline-offset: -4px; border-radius: calc(var(--radius) - 1px); }
    .card-banner {
      display: grid;
      place-items: center;
      position: relative;
      width: 100%;
      height: 111px;
      overflow: hidden;
      isolation: isolate;
      font-size: 52px;
      font-weight: 850;
      line-height: 1;
    }
    .card-banner::before, .card-banner::after { content: ""; position: absolute; z-index: -1; }
    .card-banner.mix { background: var(--lemon); color: #7134b4; }
    .card-banner.mix::before {
      width: 170px;
      height: 170px;
      border: 1px solid #dec461;
      border-radius: 50%;
      box-shadow: 0 0 0 21px #eacc5738, 0 0 0 42px #eacc5724;
    }
    .card-banner.mix span { transform: rotate(-12deg); text-shadow: 3px 4px #be86dc; }
    .card-banner.mix::after { width: 10px; height: 10px; border-radius: 50%; background: #a879d1; box-shadow: 108px 26px #bd90dc; transform: translate(-53px, -18px); }
    .card-banner.science { background: var(--lime); color: #28614d; }
    .card-banner.science::before { width: 193px; height: 62px; border: 1px solid #8fbd6b; border-radius: 50%; transform: rotate(-18deg); }
    .card-banner.science::after { width: 152px; height: 44px; border: 1px solid #8fbd6b; border-radius: 50%; transform: rotate(15deg); }
    .card-banner.science span { font-family: "Segoe UI Symbol", sans-serif; font-size: 62px; text-shadow: 2px 2px #a2d98b; }
    .card-banner.words { background: var(--pink); color: #7b346c; }
    .card-banner.words::before { width: 70px; height: 70px; border: 1px solid #ce9bbf; border-radius: 12px; transform: translateX(-24px) rotate(-18deg); background: #fff5fb; }
    .card-banner.words::after { width: 70px; height: 70px; border: 1px solid #ce9bbf; border-radius: 12px; transform: translateX(25px) rotate(14deg); background: #f3c1df; }
    .card-banner.words span { font-size: 42px; letter-spacing: .06em; transform: rotate(-5deg); }
    .card-banner.custom { background: var(--lavender); color: var(--purple); }
    .card-banner.custom::before { width: 96px; height: 74px; background: #f9f6ff; border-radius: 16px; transform: rotate(-8deg); box-shadow: 6px 5px #cdb9fd; }
    .card-info { display: flex; flex: 1; flex-direction: column; gap: 5px; padding: 16px 18px 14px; width: 100%; }
    .card-info strong { font-size: 1.24rem; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .card-description { color: var(--muted); font-size: .93rem; line-height: 1.45; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; padding-top: 11px; color: #55446e; font-size: .84rem; font-weight: 660; }
    .card-arrow { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #f0ebfa; color: var(--purple-dark); font-size: 1.05rem; }
    .card-play:hover .card-arrow { background: var(--purple); color: white; }
    .card-edit { padding: 0 16px 12px; }
    .footnote { margin-top: 26px; color: var(--muted); font-size: .83rem; }
    kbd { display: inline-block; min-width: 1.35em; padding-inline: .25em; border: 1px solid #dad1e6; border-bottom-width: 2px; border-radius: 4px; text-align: center; background: white; color: var(--ink); font: inherit; font-weight: 700; }
    .status { padding: 12px 14px; border-radius: 10px; background: #eee8fc; color: #482b86; line-height: 1.5; }
    .home-status { margin-top: 18px; }

    .work-area { width: min(100%, 880px); margin-inline: auto; }
    .screen-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 20px; }
    .screen-subtitle { max-width: 60ch; margin-top: 9px; color: var(--muted); line-height: 1.55; }
    .game-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .pill { display: inline-flex; align-items: center; min-height: 35px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: white; font-size: .87rem; font-weight: 730; font-variant-numeric: tabular-nums; }
    .time-pill { background: #eee8ff; border-color: #dfd3ff; color: #512ab9; min-width: 76px; justify-content: center; }
    .time-pill.urgent { background: #fff0cb; border-color: #ead08d; color: #783e0c; }
    .countdown-track, .progress-track { height: 7px; border-radius: 99px; overflow: hidden; background: #e8e0f1; }
    .countdown-bar, .progress-bar { height: 100%; width: 100%; background: var(--purple); }
    .countdown-bar { transform-origin: left; }
    .countdown-bar.urgent { background: #ac5528; }
    .question-panel {
      display: grid;
      align-content: center;
      min-height: 188px;
      margin-top: 13px;
      padding: clamp(20px, 4vw, 38px);
      border-radius: 24px;
      background: var(--lavender);
      border: 1px solid #ddd0fa;
    }
    .game-name { color: #5a477a; font-weight: 720; font-size: .93rem; overflow-wrap: anywhere; }
    .question-panel h1 { margin-top: 7px; font-size: clamp(1.75rem, 4.2vw, 2.77rem); font-weight: 810; line-height: 1.12; letter-spacing: -.045em; overflow-wrap: anywhere; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 15px; }
    .answer {
      display: flex;
      align-items: center;
      text-align: left;
      gap: 12px;
      min-height: 75px;
      padding: 10px 13px;
      border: 1px solid #dcd2eb;
      border-radius: 15px;
      box-shadow: 0 3px 0 #e6dfef;
      background: #fff;
      color: var(--ink);
      font-size: 1.04rem;
      font-weight: 680;
      overflow-wrap: anywhere;
    }
    .answer:not(:disabled):hover { background: #f5efff; border-color: #ab91e8; }
    .answer-key { display: grid; place-items: center; flex: 0 0 39px; height: 39px; border-radius: 10px; background: var(--lavender); color: #432a77; font-weight: 800; }
    .answer:nth-child(2) .answer-key { background: var(--lemon); color: #624a09; }
    .answer:nth-child(3) .answer-key { background: var(--lime); color: #31582c; }
    .answer:nth-child(4) .answer-key { background: var(--pink); color: #763461; }
    .answer.correct { background: #eaf8dc; border-color: #90b98a; box-shadow: 0 3px 0 #c5e0bd; }
    .answer.incorrect { background: #fff0f3; border-color: #dba1ae; box-shadow: 0 3px 0 #f0cbd3; }
    .answer-state { margin-left: auto; text-align: right; font-size: .76rem; font-weight: 800; }
    .answer.correct .answer-state { color: #2b642e; }
    .answer.incorrect .answer-state { color: #9a2b47; }
    .feedback { margin-top: 19px; padding: 17px 19px; border: 1px solid var(--line); border-radius: 15px; background: white; }
    .feedback p { margin-top: 5px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
    .game-actions { display: flex; justify-content: flex-end; margin-top: 14px; }

    .results-panel { padding: clamp(22px, 5vw, 44px); border: 1px solid #dacbf9; border-radius: 26px; background: var(--lavender); }
    .results-panel h1 { margin-bottom: 9px; }
    .results-panel p { color: #5a477a; overflow-wrap: anywhere; }
    .result-numbers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-block: 23px; }
    .result-number { padding: 17px; border: 1px solid #dacaf6; border-radius: 15px; background: #fff; }
    .result-number span { display: block; color: var(--muted); font-weight: 680; font-size: .88rem; }
    .result-number strong { display: block; margin-top: 5px; font-size: clamp(1.5rem, 5vw, 2.6rem); line-height: 1; letter-spacing: -.045em; }
    .result-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .review { margin-top: 17px; padding: 16px 20px; border: 1px solid var(--line); border-radius: 15px; background: white; }
    .review summary { color: var(--purple-dark); cursor: pointer; font-weight: 750; }
    .review ol { margin: 13px 0 0; padding-left: 22px; }
    .review li { padding: 11px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .review p { color: var(--muted); margin-top: 4px; line-height: 1.5; }

    .builder-panel, .editor-question { padding: clamp(16px, 4vw, 25px); border: 1px solid var(--line); border-radius: 17px; background: #fff; }
    .field { display: grid; gap: 6px; min-width: 0; font-size: .91rem; font-weight: 700; }
    .field input, .field select, .field textarea { min-width: 0; width: 100%; padding: 10px 12px; border: 1px solid #cbc0dd; border-radius: 9px; background: white; color: var(--ink); font: inherit; font-weight: 500; }
    .field textarea { resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: #716683; }
    .editor-question { margin: 17px 0 0; min-inline-size: 0; }
    .editor-question legend { padding-inline: 6px; font-weight: 780; }
    .option-editor { margin: 14px 0; padding: 0; border: 0; min-inline-size: 0; }
    .option-editor legend { padding: 0; color: var(--muted); font-size: .87rem; font-weight: 650; }
    .editor-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 15px; margin-top: 8px; }
    .editor-choice { display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: end; gap: 9px; }
    .editor-choice input[type="radio"] { margin: 0 0 12px; width: 18px; height: 18px; accent-color: var(--purple); }
    .editor-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
    .builder-actions { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    .builder-actions > div { display: flex; flex-wrap: wrap; gap: 8px; }
    .form-message { margin-top: 12px; color: #a02646; font-weight: 650; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .room-setup { width: min(100%, 600px); }
    .room-form { display: grid; gap: 16px; margin-top: 20px; }
    .room-form .builder-actions { margin-top: 0; }
    .question-time-field { max-width: 15rem; }
    .editor-question .question-time-field { margin-top: 14px; }
    .room-pin-input { font-variant-numeric: tabular-nums; letter-spacing: .13em; }
    .room-lobby { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
    .room-code-panel { min-width: 0; padding: clamp(20px, 4vw, 32px); border: 1px solid #ddcef8; border-radius: 23px; background: var(--lavender); }
    .room-code-panel h1 { margin-bottom: 12px; }
    .room-code {
      display: block;
      margin: 4px 0 14px;
      font-size: clamp(2.4rem, 7.7vw, 4.45rem);
      font-weight: 850;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: .075em;
      color: var(--purple-dark);
      white-space: nowrap;
    }
    .room-lobby h2, .leaderboard h2 { font-size: 1.2rem; letter-spacing: -.025em; }
    .room-control-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 17px; }
    .players { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 13px 0 0; list-style: none; }
    .players li { white-space: normal; overflow-wrap: anywhere; }
    .room-waiting { padding-block: 27px; }
    .answer.picked { background: #efebff; border-color: #ab91e8; }
    .leaderboard { margin-top: 16px; }
    .leaderboard ol { margin: 12px 0 0; padding: 0; list-style: none; }
    .leaderboard li { display: grid; grid-template-columns: 2.4ch minmax(0, 1fr) auto minmax(3ch, auto); gap: 11px; padding: 11px 5px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .leaderboard li:last-child { border: 0; }
    .leaderboard .you { background: #f2edff; border-radius: 6px; }
    .leaderboard .rank { color: var(--muted); text-align: right; }
    .rank-shift { text-align: right; font-weight: 740; color: var(--muted); white-space: nowrap; }
    .rank-shift.up { color: #25714a; }
    .rank-shift.down { color: #992f4e; }
    .question-image { display: block; margin: 14px auto 0; max-width: 100%; max-height: 340px; object-fit: contain; border-radius: 8px; }
    .image-editor { display: grid; gap: 8px; margin-top: 15px; }
    .image-editor input[type="file"] { width: 100%; max-width: 400px; color: var(--muted); }
    .image-editor input::file-selector-button { margin-right: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: #f3effc; color: var(--purple-dark); font: inherit; cursor: pointer; }
    .image-editor .question-image { max-height: 150px; margin: 2px 0; }
    .image-editor .button { justify-self: start; }
    .image-message { color: var(--muted); font-size: .88rem; }
    .image-message:empty { display: none; }
    .distribution { margin-top: 16px; }
    .distribution h2, .student-answers summary { font-weight: 760; font-size: 1.12rem; }
    .distribution-bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(5px, 1.7vw, 14px); margin-top: 12px; }
    .distribution-cell { text-align: center; overflow-wrap: anywhere; }
    .distribution-plot { position: relative; height: 143px; display: flex; align-items: end; justify-content: center; }
    .distribution-bar { width: 100%; height: var(--bar-height); border-radius: 8px 8px 0 0; background: var(--bar); }
    .distribution-count { position: absolute; inset-inline: 0; bottom: calc(var(--bar-height) + 4px); font-weight: 780; font-variant-numeric: tabular-nums; }
    .distribution-letter { display: block; padding-block: 5px; background: var(--bar); border-top: 1px solid #ffffff60; border-radius: 0 0 7px 7px; color: white; font-weight: 780; }
    .distribution-option { display: block; margin-top: 6px; font-size: .86rem; line-height: 1.3; }
    .distribution-correct { display: block; font-size: .76rem; color: #256344; font-weight: 750; }
    .distribution-note { margin-top: 12px; color: var(--muted); font-size: .88rem; }
    .student-answers { margin-top: 13px; }
    .student-answers summary { cursor: pointer; }
    .student-answers ul { max-height: 280px; overflow: auto; list-style: none; padding: 0; margin: 9px 0 0; }
    .student-answers li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 12px; padding-block: 7px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .student-answers li span { color: var(--muted); }
    .room-finish { display: grid; gap: 9px; }
    .room-status { margin-top: 12px; color: var(--muted); min-height: 1.5em; line-height: 1.5; }
    .room-status:empty { display: none; }

    @media (prefers-reduced-motion: no-preference) {
      .hero-intro .hero-art {
        animation: artwork-arrive 640ms cubic-bezier(.22, .77, .26, 1) both;
      }

      .room-transition .distribution-bar {
        transform-origin: center bottom;
        animation: answer-bar-grow 460ms cubic-bezier(.19, .72, .26, 1) both;
        animation-delay: calc(60ms * var(--stagger));
      }

      .room-transition .leaderboard li {
        animation: rank-settle 390ms cubic-bezier(.2, .75, .28, 1) both;
        animation-delay: calc(48ms * var(--stagger));
      }

      @keyframes artwork-arrive {
        from { opacity: .35; transform: translateY(16px) scale(.94) rotate(-5deg); }
        to { opacity: 1; transform: none; }
      }

      @keyframes answer-bar-grow {
        from { transform: scaleY(.04); }
        to { transform: scaleY(1); }
      }

      @keyframes rank-settle {
        from { opacity: .45; transform: translateY(var(--rank-offset)); }
        to { opacity: 1; transform: none; }
      }
    }

    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      .quiz-card { transition: transform 180ms ease; }
      .quiz-card:hover { transform: translateY(-3px); }
    }

    @media (max-width: 830px) {
      .page-width { width: calc(100% - 40px); }
      .hero-copy { padding-left: 33px; }
      .hero::before { right: -32px; width: 340px; }
      .hero-art { right: 0; }
      .cards { gap: 12px; }
    }
    @media (max-width: 620px) {
      .page-width { width: calc(100% - 28px); }
      .topbar-inner { min-height: 65px; }
      .topbar nav { gap: 0; }
      .topbar .browse { display: none; }
      .topbar .outline { padding-inline: 10px; }
      #app { padding-block: 21px 35px; }
      .hero { grid-template-columns: 1fr; min-height: 0; border-radius: 23px; }
      .hero-copy { padding: 24px 20px 0; }
      .hero h1 { font-size: clamp(2.8rem, 12.5vw, 4.3rem); margin-block: 11px 9px; }
      .hero h1 br { display: none; }
      .hero p { font-size: .98rem; }
      .hero-actions { margin-top: 15px; }
      .hero-actions .button { min-height: 44px; }
      .hero-art { position: relative; inset: auto; width: 100%; height: 175px; }
      .hero::before { top: auto; bottom: -183px; right: calc(50% - 137px); width: 274px; translate: 0 0; }
      .library { margin-top: 27px; }
      .cards { grid-template-columns: 1fr; gap: 13px; }
      .card-play { flex-direction: row; align-items: stretch; }
      .card-banner { width: 99px; height: auto; min-height: 112px; flex: 0 0 99px; }
      .card-banner.words::before, .card-banner.words::after { width: 47px; height: 52px; }
      .card-banner.words::before { transform: translateX(-15px) rotate(-18deg); }
      .card-banner.words::after { transform: translateX(14px) rotate(14deg); }
      .card-banner.words span { font-size: 33px; }
      .card-info { padding: 12px; }
      .card-meta { padding-top: 7px; }
      .answers, .editor-choices { grid-template-columns: 1fr; }
      .answer { min-height: 58px; }
      .screen-head { margin-bottom: 13px; gap: 7px; }
      .screen-head .button { padding-inline: 8px; }
      .room-lobby { grid-template-columns: 1fr; }
    }
    @media (max-width: 355px) {
      .hero-actions { gap: 12px; }
      .screen-head .button { min-height: 38px; }
      .game-meta { gap: 5px; }
      .pill { padding-inline: 7px; font-size: .79rem; }
    }
  </style>
</head>

    const storageKey = "quizpop.quizzes.v1";
    const minQuestionSeconds = 5;
    const maxQuestionSeconds = 300;
    const maxImageBytes = 64 * 1024;
    const imagePattern = /^data:image\/jpeg;base64,\/9j\/[A-Za-z0-9+/]*={0,2}$/;
    const timeInputLimits = `type="number" inputmode="numeric" min="${minQuestionSeconds}" max="${maxQuestionSeconds}" step="1"`;
    const maxQuestions = 20;
    const letters = ["A", "B", "C", "D"];

    const heroArt = document.querySelector("#hero-asset");
    let customQuizzes = readQuizzes();
    let timed = true;
    let game = null;
    let timerId = 0;
    let editorId = null;
    let nextEditorRow = 0;
    let roomForm = null;
    let roomView = null;
    const roomSessionKey = "quizpop.room.v1";
    const roomApi = ["127.0.0.1", "localhost"].includes(location.hostname)
      ? location.origin
      : document.querySelector('meta[name="quizpop-room-api"]').content;
    let roomSession = restoreRoom();

    function questionWithTime(question) {
      return [...question.slice(0, 4), question[4] ?? defaultQuestionSeconds, question[5] ?? null];
    }

    function readQuizzes() {
      try {
        const items = JSON.parse(localStorage.getItem(storageKey) || "[]");
        if (!Array.isArray(items)) return [];

        return items.filter(quiz =>
          quiz && typeof quiz.id === "string" && quiz.id.startsWith("custom-") &&
          typeof quiz.title === "string" && quiz.title.trim() &&
          Array.isArray(quiz.questions) && quiz.questions.length > 0 &&
          quiz.questions.length <= maxQuestions && quiz.questions.every(question =>
            Array.isArray(question) && typeof question[0] === "string" &&
            Array.isArray(question[1]) && question[1].length === 4 &&
            question[1].every(answer => typeof answer === "string") &&
            Number.isInteger(question[2]) && question[2] >= 0 && question[2] < 4 &&
            typeof question[3] === "string" &&
            (question[4] == null || (Number.isInteger(question[4]) &&
              question[4] >= minQuestionSeconds && question[4] <= maxQuestionSeconds)) &&
            (question[5] == null || validImage(question[5]))
          )
        ).map(quiz => ({
          id: quiz.id,
          title: quiz.title,
          theme: "custom",
          icon: "✎",
          description: "Your custom quiz.",
          questions: quiz.questions.map(questionWithTime)
        }));
      } catch {
        return [];
      }
    }

    function persistQuizzes() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(customQuizzes));
        return "";
      } catch {
        return "Browser storage is full or unavailable. Changes will last until you close or refresh this page.";
      }
    }

    function escapeHtml(value) {
      const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(value).replace(/[&<>"']/g, character => entities[character]);
    }

    function stopClock() {
      window.clearInterval(timerId);
      timerId = 0;
    }

    function moveTo(selector) {
      app.querySelector(selector)?.focus({ preventScroll: true });

    function findQuiz(id) {

    function startQuiz(id) {

    function showQuestion() {
      stopClock();
      const [prompt, options, , , seconds, image] = game.quiz.questions[game.index];
      game.duration = seconds * 1000;
      const count = game.quiz.questions.length;
      app.innerHTML = `

      moveTo("#question-title");
      if (game.timed) {
        game.endsAt = performance.now() + game.duration;

    function updateClock() {
      const remaining = Math.max(0, game.endsAt - performance.now());
      const time = app.querySelector("#countdown");
      const bar = app.querySelector("#time-bar");
      const label = `${Math.ceil(remaining / 1000)}s left`;
      if (time.textContent !== label) time.textContent = label;
      bar.style.transform = `scaleX(${remaining / game.duration})`;
      time.classList.toggle("urgent", remaining < 5000);
      bar.classList.toggle("urgent", remaining < 5000);
      if (!remaining) submitAnswer(null);
    }

    function submitAnswer(index) {
      if (!game || game.answers.length !== game.index) return;

      const { duration } = game;
      const remaining = game.timed ? Math.max(0, game.endsAt - performance.now()) : duration;
      if (!remaining) index = null;
      stopClock();
      const [, options, correctIndex, explanation] = game.quiz.questions[game.index];
      const correct = index === correctIndex;
      const points = correct ? 600 + Math.round(400 * remaining / duration) : 0;
      game.score += points;
      game.answers.push({ index, correct });

      if (game.timed) {
        app.querySelector("#countdown").textContent = index === null ? "Time’s up" : "Answered";
        app.querySelector("#time-bar").style.transform = `scaleX(${remaining / duration})`;
      }
      app.querySelector("#points").textContent = `${game.score.toLocaleString()} pts`;

      for (const button of app.querySelectorAll(".answer")) {
        const answerIndex = Number(button.dataset.index);
        const state = button.querySelector(".answer-state");
        button.disabled = true;
        if (answerIndex === correctIndex) {
          button.classList.add("correct");
          state.textContent = "Correct";
          state.hidden = false;
        } else if (answerIndex === index) {
          button.classList.add("incorrect");
          state.textContent = "Your answer";
          state.hidden = false;
        }
      }

      const heading = correct ? `Correct! +${points.toLocaleString()} points` : (index === null ? "Time’s up!" : "Incorrect");
      const detail = correct && explanation ? "" : `Correct answer: ${escapeHtml(options[correctIndex])}.`;
      app.querySelector("#feedback").innerHTML = `
        <div class="feedback">
          <strong>${heading}</strong>
          ${detail ? `<p>${detail}</p>` : ""}
          ${explanation ? `<p>${escapeHtml(explanation)}</p>` : ""}
        </div>`;
      app.querySelector("#next-actions").hidden = false;
      app.querySelector("#next-question").focus({ preventScroll: index === null });
    }

    function addEditorQuestion(question = ["", ["", "", "", ""], 0, ""], focus = true) {

    function refreshEditorButtons() {
      const rows = [...app.querySelectorAll(".editor-question")];
      rows.forEach((row, index) => {
        row.querySelector(".editor-number").textContent = `Question ${index + 1}`;
        row.querySelector("[data-action='remove-question']").hidden = rows.length <= 1;

    function validImage(source) {
      return typeof source === "string" && source.length <= 23 + 4 * Math.ceil(maxImageBytes / 3) && imagePattern.test(source);
    }

    async function resizeQuestionImage(file) {
      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type) || file.size > 12 * 1024 * 1024) {
        throw new Error("Choose a JPG, PNG, or WebP image up to 12 MB.");
      }
      const bitmap = await createImageBitmap(file);
      try {
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d", { alpha: false });
        const scale = Math.min(1, 1000 / Math.max(bitmap.width, bitmap.height));
        for (const [size, quality] of [[1, .88], [1, .69], [.8, .72], [.63, .67], [.48, .56]]) {
          canvas.width = Math.max(1, Math.round(bitmap.width * scale * size));
          canvas.height = Math.max(1, Math.round(bitmap.height * scale * size));
          context.fillStyle = "#fff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
          if (blob && blob.size <= maxImageBytes) {
            return await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(reader.error);
              reader.readAsDataURL(blob);
            });
          }
        }
        throw new Error("Choose a smaller image for this question.");
      } finally {
        bitmap.close();
      }
    }

    function setEditorImage(row, source) {
      const preview = row.querySelector("[data-field='image-preview']");
      row.querySelector("[data-field='image']").value = source;
      if (source) preview.src = source;
      else preview.removeAttribute("src");
      preview.hidden = !source;
      row.querySelector("[data-action='remove-image']").hidden = !source;
    }

    async function uploadQuestionImage(input) {
      const file = input.files[0];
      if (!file) return;
      const row = input.closest(".editor-question");
      const message = row.querySelector(".image-message");
      const remove = row.querySelector("[data-action='remove-image']");
      input.value = "";
      input.disabled = true;
      remove.disabled = true;
      row.setAttribute("data-image-loading", "");
      message.textContent = "Preparing image…";
      refreshEditorButtons();
      try {
        const source = await resizeQuestionImage(file);
        if (!validImage(source)) throw new Error("Choose a different image.");
        if (row.isConnected) {
          setEditorImage(row, source);
          message.textContent = "";
        }
      } catch (error) {
        if (row.isConnected) message.textContent = error instanceof DOMException ? "This image couldn’t be opened." : error.message;
      } finally {
        if (row.isConnected) {
          row.removeAttribute("data-image-loading");
          input.disabled = false;
          remove.disabled = false;
          refreshEditorButtons();
        }
      }
    }

    function saveQuiz(form) {
      const fields = form.querySelectorAll("[required]:not([type='radio'])");
      const blank = [...fields].find(field => !field.value.trim());
      if (blank) {
        const message = app.querySelector("#editor-message");
        message.textContent = "Enter a quiz title, a question, and four answers for each question.";
        message.hidden = false;
        blank.focus();
        return;
      }

      const quiz = {
        id: editorId ?? `custom-${Date.now()}-${Math.random().toString(36).slice(2)}`,
        title: form.elements.title.value.trim(),
        theme: "custom",
        icon: "✎",
        description: "Your custom quiz.",
        questions: [...form.querySelectorAll(".editor-question")].map(row => [
          row.querySelector("[data-field='prompt']").value.trim(),
          [...row.querySelectorAll("[data-field='choice']")].map(input => input.value.trim()),
          Number(row.querySelector("input[type='radio']:checked").value),
          row.querySelector("[data-field='explanation']").value.trim(),
          row.querySelector("[data-field='seconds']").valueAsNumber,
          row.querySelector("[data-field='image']").value || null
        ])
      };

      if (editorId) {
        customQuizzes = customQuizzes.map(item => item.id === editorId ? quiz : item);
      } else {
        customQuizzes.push(quiz);
      }
      showHome(persistQuizzes() || `“${quiz.title}” is ready to play.`, false);
      app.querySelector("#my-quizzes-title").focus();
    }

    function restoreRoom() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(roomSessionKey) || "null");
        if (/^[0-9]{6}$/.test(saved?.code) && /^[a-f0-9]{64}$/.test(saved?.token)) return saved;
      } catch {}
      return null;
    }

    function rememberRoom(session) {
      roomSession = session;
      try {
        if (session) sessionStorage.setItem(roomSessionKey, JSON.stringify(session));
        else sessionStorage.removeItem(roomSessionKey);
      } catch {}
    }

    function stopRoomView() {
      roomForm = null;
      if (!roomView) return;
      window.clearTimeout(roomView.poll);
      window.clearInterval(roomView.ticker);

    function showRoomSetup(role, code = "") {
      stopRoomView();

      game = null;
      const hosting = role === "host";
      const token = Array.from(crypto.getRandomValues(new Uint8Array(32)), byte => byte.toString(16).padStart(2, "0")).join("");
      roomForm = { role, token };
      app.innerHTML = `
        <section class="work-area builder-panel room-setup" aria-labelledby="room-heading">
          <h1 class="screen-title" id="room-heading" tabindex="-1">${hosting ? "Host a quiz" : "Join a quiz"}</h1>
          <p class="screen-subtitle">${hosting ? "Pick a quiz to create a room code for your players." : "Enter the six-digit code from your host and choose a nickname."}</p>
          <form id="room-form" class="room-form">
            ${hosting ? `
              <label class="field">Quiz
                <select name="quiz">
                  ${[...builtInQuizzes, ...customQuizzes].map(quiz => `<option value="${escapeHtml(quiz.id)}">${escapeHtml(quiz.title)}</option>`).join("")}
                </select>
              </label>` : `
              <label class="field">Room code
                <input class="room-pin-input" name="code" type="text" inputmode="numeric" autocomplete="off" maxlength="12" required value="${escapeHtml(code)}" placeholder="123456">
              </label>
              <label class="field">Nickname
                <input name="nickname" maxlength="24" autocomplete="off" required>
              </label>`}
            <p id="room-form-error" class="form-message" role="alert" hidden></p>
            <div class="builder-actions">
              <button type="button" class="button outline" data-action="home">Back</button>
              <button type="submit" class="button primary">${hosting ? "Create room" : "Join room"}</button>
            </div>
          </form>
        </section>`;
      moveTo("#room-heading");
    }

    async function roomRequest(path, token, data) {
      if (!roomApi || location.protocol === "file:") throw new Error("Open the hosted QuizPop site or run the local server to play a live quiz.");
      const headers = { Authorization: `Bearer ${token}` };
      const options = { headers, cache: "no-store", signal: AbortSignal.timeout(path === "" ? 20000 : 8000) };
      if (data !== undefined) {
        headers["Content-Type"] = "application/json";
        options.method = "POST";
        options.body = JSON.stringify(data);
      }
      let response;
      let payload;
      try {
        response = await fetch(`${roomApi}/api/rooms${path}`, options);
        payload = await response.json();
      } catch {
        throw new Error("Couldn’t reach the room service. Check your connection and try again.");
      }
      if (!response.ok) {
        const error = new Error(payload.error || "The room service is unavailable. Try again.");
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    async function submitRoomForm(form) {
      const setup = roomForm;
      const submit = form.querySelector('[type="submit"]');
      if (!setup || submit.disabled) return;
      const message = form.querySelector("#room-form-error");
      const fields = new FormData(form);
      submit.disabled = true;
      message.hidden = true;
      try {
        let result;
        if (setup.role === "host") {
          const { title, questions } = findQuiz(fields.get("quiz"));
          result = await roomRequest("", setup.token, { quiz: { title, questions }, seconds: defaultQuestionSeconds });
        } else {
          const code = fields.get("code").replace(/[\s-]/g, "");
          if (!/^[0-9]{6}$/.test(code)) throw new Error("Enter a six-digit room code.");
          result = await roomRequest(`/${code}/join`, setup.token, { nickname: fields.get("nickname") });
        }
        if (setup !== roomForm) return;
        rememberRoom({ code: result.code, token: setup.token });
        const url = new URL(location.href);
        if (url.searchParams.has("join")) {
          url.searchParams.delete("join");
          history.replaceState(null, "", url);
        }
        openRoom();
      } catch (error) {
        if (setup !== roomForm) return;
        message.textContent = error.message;
        message.hidden = false;
        submit.disabled = false;
      }
    }

    function openRoom() {
      if (!roomSession) return;
      stopRoomView();
      stopClock();
      game = null;
      const view = { session: roomSession, state: null, offset: 0, revision: 0 };
      roomView = view;
      app.innerHTML = `
        <section class="work-area builder-panel">
          <h1 class="screen-title" id="room-heading" tabindex="-1">Connecting to room</h1>
          <p class="room-status" id="room-status" role="status"></p>
          <button type="button" class="button outline" data-action="home">Back to quizzes</button>
        </section>`;
      moveTo("#room-heading");
      view.ticker = window.setInterval(() => updateRoomTimer(view), 200);
      void syncRoom(view);
    }

    async function syncRoom(view) {
      if (view !== roomView || view.syncing || view.pending) return;
      window.clearTimeout(view.poll);
      view.syncing = true;
      const revision = view.revision;
      const sent = performance.now();
      try {
        const state = await roomRequest(`/${view.session.code}`, view.session.token);
        if (view !== roomView || view.revision !== revision || view.pending) return;
        const received = performance.now();
        view.offset = state.serverTime - (sent + received) / 2;
        const { serverTime, ...visible } = state;
        const signature = JSON.stringify(visible);
        if (signature !== view.signature) {
          const newScreen = state.phase !== view.state?.phase || state.index !== view.state?.index || state.ranking !== view.state?.ranking;
          view.state = state;
          view.signature = signature;
          renderRoom(view, newScreen);
        }
        updateRoomImage(view);
        if (view.offline) {
          setRoomStatus("");
          view.offline = false;
        }
        if (state.phase === "finished") window.clearInterval(view.ticker);
      } catch (error) {
        if (view !== roomView || view.revision !== revision) return;
        if (error.status === 401 || error.status === 404) {
          rememberRoom(null);
          showHome(error.message);
          return;
        }
        view.offline = true;
        setRoomStatus(`${error.message} Reconnecting…`);
      } finally {
        view.syncing = false;
        if (view === roomView && view.state?.phase !== "finished") {
          view.poll = window.setTimeout(() => void syncRoom(view), view.offline ? 3000 : 1200);
        }
      }
    }

    function lobbyMarkup(state) {
      const hosting = state.role === "host";
      if (!hosting) {
        return `
          <div class="room-code-panel room-waiting">
            <h1 class="screen-title" id="room-heading" tabindex="-1">You’re in, ${escapeHtml(state.nickname)}!</h1>
            <p class="screen-subtitle">Waiting for the host to start ${escapeHtml(state.title)}.</p>
          </div>`;
      }
      const joined = state.playerCount;
      return `
        <div class="room-lobby">
          <div class="room-code-panel">
            <h1 class="screen-title" id="room-heading" tabindex="-1">${escapeHtml(state.title)}</h1>
            <p>Room code</p>
            <strong class="room-code">${state.code}</strong>
            <p class="screen-subtitle">Ask players to open QuizPop, choose Join a quiz, and enter this code.</p>
            <div class="room-control-row">
              <button type="button" class="button outline" data-action="copy-code">Copy code</button>
              <button type="button" class="button outline" data-action="copy-link">Copy join link</button>
            </div>
          </div>
          <div class="builder-panel">
            <h2>${joined} ${joined === 1 ? "player" : "players"} joined</h2>
            ${joined ? `<ul class="players">${state.players.map(name => `<li class="pill">${escapeHtml(name)}</li>`).join("")}</ul>` : '<p class="screen-subtitle">Waiting for players to join.</p>'}
            <div class="room-control-row">
              <button type="button" class="button primary" data-action="advance-room" ${joined ? "" : "disabled"}>Start quiz</button>
            </div>
          </div>
        </div>`;
    }

    function boardMarkup(state) {
      return `
        <section class="builder-panel leaderboard" aria-label="Top five">
          ${state.phase === "finished" ? "<h2>Top five</h2>" : ""}
          <ol>${state.leaderboard.map((player, index) => {
            const delta = player.movement;
            const offset = Math.max(-28, Math.min(28, (delta ?? 0) * 14)) || 8;
            const direction = delta > 0 ? "up" : "down";
            const shift = delta ? `${delta > 0 ? "↑" : "↓"} ${Math.abs(delta)}` : delta == null ? "New" : "—";
            const shiftLabel = delta ? `${direction} ${Math.abs(delta)} ${Math.abs(delta) === 1 ? "place" : "places"}` : delta == null ? "First ranking" : "No change";
            return `
              <li class="${player.you ? "you" : ""}" style="--stagger:${index};--rank-offset:${offset}px">
                <span class="rank">${player.rank ?? index + 1}</span>
                <span>${escapeHtml(player.nickname)}${player.you ? " (you)" : ""}</span>
                <strong>${player.score.toLocaleString()} pts</strong>
                <span class="rank-shift ${delta ? direction : ""}" aria-label="${shiftLabel}">${shift}</span>
              </li>`;
          }).join("")}</ol>
          ${state.yourRank > 5 ? `<p class="screen-subtitle">Your rank is ${state.yourRank}.</p>` : ""}
        </section>`;
    }

    function distributionMarkup(state) {
      if (!state.distribution) return "";
      const { counts, unanswered } = state.distribution;
      const { options, correct } = state.question;
      const peak = Math.max(1, ...counts);
      const colors = ["#ae3547", "#375faa", "#9a6111", "#3c783e"];
      return `
        <section class="builder-panel distribution" aria-label="Answer distribution">
          <h2>How the room answered</h2>
          <div class="distribution-bars">
            ${counts.map((count, index) => `
              <div class="distribution-cell" style="--bar:${colors[index]};--stagger:${index};--bar-height:${Math.max(3, 82 * count / peak)}%">
                <div class="distribution-plot">
                  <span class="distribution-count">${count}<span class="visually-hidden"> responses for</span></span>
                  <span class="distribution-bar" aria-hidden="true"></span>
                </div>
                <span class="distribution-letter">${letters[index]}</span>
                <span class="distribution-option">${escapeHtml(options[index])}</span>
                ${index === correct ? '<span class="distribution-correct">✓ Correct</span>' : ""}
              </div>`).join("")}
          </div>
          ${unanswered ? `<p class="distribution-note">${unanswered} ${unanswered === 1 ? "player didn’t" : "players didn’t"} answer.</p>` : ""}
        </section>
        ${state.responses ? `
          <details class="builder-panel student-answers" open>
            <summary>Student answers</summary>
            <ul>${state.responses.map(({ nickname, choice }) => `
              <li><strong>${escapeHtml(nickname)}</strong><span>${choice === null ? "No answer" : `${letters[choice]}. ${escapeHtml(options[choice])}`}</span></li>
            `).join("")}</ul>
          </details>` : ""}`;
    }

    function rankingMarkup(state) {
      return `
        <div class="room-code-panel room-finish">
          <h1 class="screen-title" id="room-heading" tabindex="-1">Top five</h1>
          <p>After question ${state.index + 1} of ${state.total}</p>
        </div>
        ${boardMarkup(state)}
        ${state.role === "host" ? `
          <div class="game-actions"><button type="button" class="button primary" data-action="advance-room">${state.index + 1 === state.total ? "Finish quiz" : "Next question"}</button></div>` : ""}`;
    }

    function roomQuestionMarkup(state) {
      const hosting = state.role === "host";
      const asking = state.phase === "question";
      const { prompt, options, correct, explanation, hasImage } = state.question;
      return `
        ${asking ? '<div class="countdown-track" aria-hidden="true"><div class="countdown-bar" id="room-time-bar"></div></div>' : ""}
        <div class="question-panel">
          <p class="game-name">${escapeHtml(state.title)}</p>
          <h1 id="room-heading" tabindex="-1">${escapeHtml(prompt)}</h1>
          ${hasImage ? '<img id="room-image" class="question-image" alt="Image for this question" hidden><p id="room-image-status" class="image-message" role="status"></p>' : ""}
        </div>
        <div class="answers" role="group" aria-label="Answers">
          ${options.map((option, index) => {
            const label = !asking && index === correct ? "Correct" : index === state.choice ? "Your answer" : "";
            const style = !asking && index === correct ? "correct" : index === state.choice ? (asking ? "picked" : "incorrect") : "";
            return `
              <button type="button" class="answer ${style}" data-action="room-answer" data-index="${index}" ${hosting || !asking || state.choice !== null ? "disabled" : ""}>
                <span class="answer-key" aria-hidden="true">${index + 1}</span>
                <span>${escapeHtml(option)}</span>
                ${label ? `<span class="answer-state">${label}</span>` : ""}
              </button>`;
          }).join("")}
        </div>
        ${asking && hosting ? `
          <div class="game-actions"><button type="button" class="button primary" data-action="advance-room">Reveal answer</button></div>` : ""}
        ${asking && !hosting && state.choice !== null ? '<p class="feedback" role="status">Answer locked in.</p>' : ""}
        ${asking ? "" : `
          <div class="feedback">
            <strong>${hosting ? "Correct answer" : state.points ? `Correct! +${state.points.toLocaleString()} points` : state.choice === null ? "No answer submitted" : "Incorrect"}</strong>
            <p>${escapeHtml(options[correct])}${explanation ? ` · ${escapeHtml(explanation)}` : ""}</p>
          </div>
          ${distributionMarkup(state)}
          ${hosting ? `<div class="game-actions"><button type="button" class="button primary" data-action="advance-room">Next: leaderboard</button></div>` : ""}`}`;
    }

    function renderRoom(view, newScreen) {
      const state = view.state;
      const activeAction = app.contains(document.activeElement) ? document.activeElement.dataset.action : null;
      const status = app.querySelector("#room-status")?.textContent || "";
      const inRound = state.phase === "question" || state.phase === "reveal";
      app.innerHTML = `
        <section class="work-area${newScreen ? " room-transition" : ""}" aria-labelledby="room-heading">
          <div class="screen-head">
            <button type="button" class="button outline" data-action="home"><span aria-hidden="true">←</span> Back to quizzes</button>
            <div class="game-meta">
              <span class="pill">${state.role === "host" ? "Host" : "Participant"}</span>
              ${inRound ? `<span class="pill">Question ${state.index + 1} of ${state.total}</span>` : ""}
              ${state.phase === "question" ? '<span class="pill time-pill" role="timer" id="room-timer"></span>' : ""}
              ${state.phase === "question" && state.role === "host" ? `<span class="pill">${state.answerCount}/${state.playerCount} answered</span>` : ""}
            </div>
          </div>
          ${state.phase === "lobby" ? lobbyMarkup(state) : state.ranking ? rankingMarkup(state) : inRound ? roomQuestionMarkup(state) : `
            <div class="room-code-panel room-finish">
              <h1 class="screen-title" id="room-heading" tabindex="-1">Quiz complete!</h1>
              <p>${escapeHtml(state.title)}</p>
            </div>
            ${boardMarkup(state)}`}
          <p class="room-status" id="room-status" role="status">${escapeHtml(status)}</p>
        </section>`;
      updateRoomTimer(view);
      if (newScreen) moveTo("#room-heading");
      else if (activeAction && activeAction !== "room-answer") {
        [...app.querySelectorAll("button[data-action]")].find(button => button.dataset.action === activeAction)?.focus({ preventScroll: true });
      }
    }

    function updateRoomImage(view) {
      const picture = app.querySelector("#room-image");
      if (!picture) return;
      const index = view.state.index;
      if (view.image?.index !== index) view.image = { index };
      const asset = view.image;
      if (asset.source) {
        if (picture.getAttribute("src") !== asset.source) picture.src = asset.source;
        picture.hidden = false;
        app.querySelector("#room-image-status").textContent = "";
        return;
      }
      if (asset.pending || Date.now() < (asset.retryAt ?? 0)) return;
      asset.pending = true;
      void roomRequest(`/${view.session.code}/image?index=${index}`, view.session.token).then(({ image }) => {
        if (!validImage(image)) throw new Error("Invalid question image.");
        asset.source = image;
        if (view === roomView && view.image === asset) updateRoomImage(view);
      }).catch(() => {
        asset.retryAt = Date.now() + 3000;
        if (view === roomView && view.image === asset) {
          const message = app.querySelector("#room-image-status");
          if (message) message.textContent = "The image is still loading.";
        }
      }).finally(() => {
        asset.pending = false;
      });
    }

    function updateRoomTimer(view) {
      if (view !== roomView || view.state?.phase !== "question") return;
      const { deadline, role, choice, index, seconds } = view.state;
      const remaining = Math.max(0, deadline - view.offset - performance.now());
      const timer = app.querySelector("#room-timer");
      if (!timer) return;
      const label = `${Math.ceil(remaining / 1000)}s left`;
      if (timer.textContent !== label) timer.textContent = label;
      timer.classList.toggle("urgent", remaining < 5000);
      const bar = app.querySelector("#room-time-bar");
      bar.style.transform = `scaleX(${Math.min(1, remaining / (seconds * 1000))})`;
      bar.classList.toggle("urgent", remaining < 5000);
      for (const button of app.querySelectorAll("[data-action='room-answer']")) {
        button.disabled = role === "host" || choice !== null || view.pending || view.lockedIndex === index || !remaining;
      }
    }

    function setRoomStatus(message) {
      const status = app.querySelector("#room-status");
      if (status) status.textContent = message;
    }

    async function roomAction(action, choice) {
      const view = roomView;
      if (!view?.state || view.pending) return;
      const { phase, index, role, deadline, ranking } = view.state;
      if (action === "answer" && (role !== "player" || phase !== "question" || view.state.choice !== null ||
          view.lockedIndex === index || performance.now() + view.offset >= deadline)) return;
      if (action === "advance" && role !== "host") return;
      view.pending = true;
      view.revision++;
      setRoomStatus("");
      const advance = app.querySelector("[data-action='advance-room']");
      if (advance) advance.disabled = true;
      updateRoomTimer(view);
      try {
        await roomRequest(`/${view.session.code}/${action}`, view.session.token, { index, phase, choice, ranking: !!ranking });
        if (view === roomView && action === "answer") view.lockedIndex = index;
      } catch (error) {
        if (view === roomView) setRoomStatus(error.message);
      } finally {
        if (view === roomView) {
          view.pending = false;
          if (advance?.isConnected) advance.disabled = false;
          updateRoomTimer(view);
          void syncRoom(view);
        }
      }
    }

    async function copyRoomLink(link) {
      const view = roomView;
      if (!view) return;
      const url = new URL(location.href);
      url.searchParams.set("join", view.session.code);
      try {
        await navigator.clipboard.writeText(link ? url.href : view.session.code);
        if (roomView === view) setRoomStatus(link ? "Join link copied." : "Room code copied.");
      } catch {
        if (roomView === view) setRoomStatus(`Share the room code ${view.session.code}.`);
      }
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      switch (button.dataset.action) {
        case "home":
          showHome();
          break;
        case "browse":
          showHome("", false);
          app.querySelector("#quiz-picker-title").focus();
          break;
        case "play":
          startQuiz(button.dataset.id);
          break;
        case "host":
        case "join":
          showRoomSetup(button.dataset.action);
          break;
        case "resume":
          openRoom();
          break;
        case "advance-room":
          void roomAction("advance");
          break;
        case "room-answer":
          void roomAction("answer", Number(button.dataset.index));
          break;
        case "copy-code":
        case "copy-link":
          void copyRoomLink(button.dataset.action === "copy-link");
          break;
        case "answer":
          submitAnswer(Number(button.dataset.index));
          break;
        case "next":
          if (game.index + 1 === game.quiz.questions.length) {
            showResults();
          } else {
            game.index++;
            showQuestion();
          }
          break;
        case "build":
          showBuilder();
          break;
        case "edit":
          showBuilder(button.dataset.id);
          break;
        case "add-question":
          addEditorQuestion();
          break;
        case "remove-image": {
          const row = button.closest(".editor-question");
          setEditorImage(row, "");
          row.querySelector(".image-message").textContent = "";
          row.querySelector("[data-field='image-file']").focus();
          break;
        }
        case "remove-question": {
          const row = button.closest(".editor-question");
          if (app.querySelectorAll(".editor-question").length <= 1) break;
          const adjacent = row.previousElementSibling || row.nextElementSibling;
          row.remove();
          refreshEditorButtons();
          adjacent.querySelector("[data-field='prompt']").focus();
          break;
        }
        case "delete-quiz": {
          const quiz = customQuizzes.find(item => item.id === editorId);
          if (!quiz || !window.confirm(`Delete “${quiz.title}” from this browser?`)) break;
          customQuizzes = customQuizzes.filter(item => item.id !== editorId);
          showHome(persistQuizzes() || `“${quiz.title}” was deleted.`);
          break;
        }
      }
    });

    app.addEventListener("change", event => {
      const input = event.target;
      if (input.id === "timed-mode") timed = input.checked;
      if (input.dataset.field === "image-file") void uploadQuestionImage(input);
    });

    app.addEventListener("submit", event => {
      if (event.target.id === "quiz-form") {
        event.preventDefault();
        if (!event.target.querySelector("[data-image-loading]")) saveQuiz(event.target);
      } else if (event.target.id === "room-form") {
        event.preventDefault();
        void submitRoomForm(event.target);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
      if (!/^[1-4]$/.test(event.key) || !app.querySelector(".answers")) return;
      const choice = Number(event.key) - 1;
      if (roomView?.state?.role === "player" && roomView.state.phase === "question") {
        event.preventDefault();
        void roomAction("answer", choice);
        return;
      }
      if (!game) return;
      event.preventDefault();
      submitAnswer(choice);
    });

    const joinCode = new URLSearchParams(location.search).get("join");
    if (/^[0-9]{6}$/.test(joinCode)) showRoomSetup("join", joinCode);
    else {
      showHome("", false);
      app.querySelector(".hero").classList.add("hero-intro");
    }
  </script>
</body>
</html>
